[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "cimist"
version = "0.1.0"
readme = "README.md"
description = "Tools for inferring residue conformations, maximum information spanning trees, and conformational entropies from protein dynamics."
license = "Apache-2.0"
license-files = ["LICEN[CSE]*", "src/cimist/utils/nerfax/NOTICE"]
requires-python = ">=3.9"

dependencies = [
    "jax>=0.4.19",
    "networkx==2.8.8",
    "cmocean",
    "cmasher",
    "dill>=0.3.4",
    "h5py>=3.7.0",
    "scipy>=1.9.3",
    "pandas>=1.3.5",
    "mdtraj>=1.10.3",
    "Bio",
    "mp_nerf==1.0.3"
]

[project.scripts]
ci-mist = "cimist.fit:main"
cimist-fit = "cimist.fit:main"
mpnn-mist = "cimist.mpnn:main"
